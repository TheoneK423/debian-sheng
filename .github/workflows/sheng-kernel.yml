name: Prepare sheng DroidSpaces kernel

on:
  push:
    branches:
      - sheng-kernel-prep-20261125
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL_WORK_DIR: kernel-work
      KERNEL_JOBS: "4"
      KERNEL_LINK_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev lz4 dwarves rsync \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo fallocate -l 16G /mnt/sheng-kernel.swap
          sudo chmod 600 /mnt/sheng-kernel.swap
          sudo mkswap /mnt/sheng-kernel.swap
          sudo swapon /mnt/sheng-kernel.swap
          df -h .
          free -h
      - name: Prepare sources and validate configuration
        timeout-minutes: 10
        run: bash build_kernel.sh prepare
      - name: Save configuration review before compilation
        uses: actions/upload-artifact@v4
        with:
          name: sheng-configuration-review
          path: kernel-work/dist
          retention-days: 14
      - name: Compile the pinned kernel with ThinLTO
        timeout-minutes: 45
        run: bash build_kernel.sh build
      - name: Upload reviewable build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-droidspaces-kernel
          path: kernel-work/dist
          if-no-files-found: warn
          retention-days: 14
