name: Prepare sheng DroidSpaces kernel

on:
  push:
    branches:
      - sheng-kernel-prep-20261125
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev lz4 dwarves rsync \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo fallocate -l 8G /mnt/sheng-kernel.swap
          sudo chmod 600 /mnt/sheng-kernel.swap
          sudo mkswap /mnt/sheng-kernel.swap
          sudo swapon /mnt/sheng-kernel.swap
          df -h .
          free -h
      - name: Compile the pinned kernel
        env:
          KERNEL_WORK_DIR: ${{ runner.temp }}/sheng-kernel
          KERNEL_JOBS: "4"
        run: bash build_kernel.sh
      - name: Upload reviewable build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-droidspaces-kernel
          path: ${{ runner.temp }}/sheng-kernel/dist
          if-no-files-found: warn
          retention-days: 14
